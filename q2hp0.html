<style>
  :root {
    --bg: #f4f4f0;
    --card: #fff;
    --text: #222;
    --muted: #777;
    --link: #1a0dab;
    --line: #ccc;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1b;
      --card: #242424;
      --text: #ddd;
      --muted: #888;
      --link: #8ab4f8;
      --line: #444;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1b;
    --card: #242424;
    --text: #ddd;
    --muted: #888;
    --link: #8ab4f8;
    --line: #444;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
    line-height: 1.5;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 18px;
    text-align: center;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--card);
    display: block;
    object-fit: cover;
    margin: 0 auto 14px;
  }
  h1 { font-size: 22px; font-weight: normal; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 28px; }
  h2 {
    font-size: 13px;
    font-weight: normal;
    color: var(--muted);
    text-align: left;
    margin: 0 0 8px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 6px;
  }
  h2.second { margin-top: 28px; }
  .cert { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: block;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 12px 14px;
    text-decoration: none;
    color: var(--link);
  }
  .item:hover { border-color: var(--link); }
  .item span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
</style>
